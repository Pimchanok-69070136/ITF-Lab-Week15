<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านสุ่มอาหารไทย</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#cfe6fb; --sky2:#eaf4ff; --blue:#4f8fd8; --blue-d:#2f5f9e;
    --wood:#b98a54; --wood-d:#8a6236; --cream:#fffaf0; --coral:#f0605d; --gold:#f2b84b; --ink:#2b3a55;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:"Sarabun","Mali",sans-serif;color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 60%,#fff 100%);padding-bottom:40px}
  /* หลังคาร้านลายทาง */
  .awning{height:84px;background:repeating-linear-gradient(90deg,#fff 0 36px,var(--blue) 36px 72px);
    border-bottom:6px solid var(--blue-d);border-radius:0 0 28px 28px;position:relative;box-shadow:0 8px 0 rgba(47,95,158,.18)}
  .awning::after{content:"";position:absolute;left:0;right:0;bottom:-22px;height:22px;
    background:repeating-radial-gradient(circle at 18px 0,var(--blue) 0 17px,transparent 18px 36px);
    -webkit-mask:linear-gradient(#000,#000);opacity:.0}
  .sign{width:max-content;max-width:92%;margin:-30px auto 0;position:relative;z-index:2;text-align:center;
    background:var(--wood);color:#fff;font-family:"Mali";font-weight:700;font-size:clamp(20px,5vw,30px);
    padding:10px 30px;border-radius:14px;border:4px solid var(--wood-d);box-shadow:0 6px 0 var(--wood-d)}
  .sign small{display:block;font-size:13px;font-weight:400;opacity:.9}
  main{max-width:880px;margin:28px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr 1.3fr;gap:22px;align-items:start}
  @media(max-width:700px){main{grid-template-columns:1fr}}

  /* คนขายของ */
  .seller{text-align:center}
  .bubble{background:#fff;border:3px solid var(--blue);border-radius:18px;padding:12px 16px;font-family:"Mali";font-size:16px;
    position:relative;display:inline-block;max-width:260px;box-shadow:0 4px 0 rgba(79,143,216,.25)}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:#fff;
    border-right:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:translateX(-50%) rotate(45deg)}
  .avatar{font-size:120px;line-height:1;margin-top:22px;filter:drop-shadow(0 8px 0 rgba(47,95,158,.15))}
  .stats{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .pill{background:rgba(47,95,158,.85);color:#fff;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600}

  /* การ์ดผลลัพธ์ */
  .card{background:var(--cream);border:4px solid var(--blue);border-radius:22px;padding:22px 20px 20px;text-align:center;
    box-shadow:0 8px 0 rgba(47,95,158,.22)}
  .tile{width:170px;height:170px;margin:0 auto 14px;border-radius:26px;border:4px solid #fff;
    background:linear-gradient(160deg,#e9f4ff,#c4def8);display:grid;place-items:center;font-size:96px;
    box-shadow:inset 0 0 0 3px var(--blue),0 5px 0 rgba(47,95,158,.2)}
  .tile.spin{animation:wob .25s infinite alternate}
  @keyframes wob{from{transform:rotate(-5deg) scale(.97)}to{transform:rotate(5deg) scale(1.03)}}
  .region{display:inline-block;font-size:13px;background:#dcebfb;color:var(--blue-d);border-radius:8px;padding:2px 10px;font-weight:600}
  h2{font-family:"Mali";font-size:clamp(24px,5vw,30px);color:var(--coral);margin:8px 0 6px}
  .desc{font-size:16px;line-height:1.6;color:#55627c;min-height:52px}
  .price{display:inline-block;margin:10px 0 16px;background:#ffe3e1;color:#c5413e;border-radius:999px;padding:6px 18px;font-weight:700}
  .price::before{content:"🪙 ";}
  button.go{width:100%;border:0;cursor:pointer;font-family:"Mali";font-weight:700;font-size:21px;color:#fff;
    background:linear-gradient(#ff7f7a,var(--coral));padding:14px;border-radius:16px;box-shadow:0 6px 0 #c4403d;transition:.1s}
  button.go:hover{filter:brightness(1.06)}
  button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c4403d}
  button.go:disabled{filter:grayscale(.4);cursor:wait}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  /* รายการเมนูทั้งหมดแบบช่องไอเทม */
  .shelf{grid-column:1/-1;background:rgba(255,255,255,.7);border:3px solid #fff;border-radius:20px;padding:16px}
  .shelf h3{font-family:"Mali";font-size:18px;margin-bottom:12px;color:var(--blue-d)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .item{background:#fff;border:3px solid #cfe0f5;border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;line-height:1.3;transition:.2s}
  .item span{display:block;font-size:34px}
  .item b{display:block;margin-top:2px;font-weight:600}
  .item.on{border-color:var(--gold);background:#fff6dc;transform:translateY(-3px);box-shadow:0 4px 0 var(--gold)}
  .hist{margin-top:12px;font-size:14px;color:#55627c}
  @media(prefers-reduced-motion:reduce){.tile.spin{animation:none}}
</style>
</head>
<body>
<div class="awning"></div>
<div class="sign">ร้านสุ่มอาหารไทย<small>เมนูแนะนำจากทั่วประเทศ</small></div>

<main>
  <section class="seller">
    <div class="bubble" id="bubble">วันนี้อยากกินอะไรดีนะ?</div>
    <div class="avatar">👩‍🍳</div>
    <div class="stats"><span class="pill" id="count">สุ่มแล้ว 0 ครั้ง</span><span class="pill">เมนู <span id="total"></span> รายการ</span></div>
  </section>

  <section class="card" aria-live="polite">
    <div class="tile" id="img">🍽️</div>
    <span class="region" id="region">เมนูไทย</span>
    <h2 id="name">กดปุ่มเพื่อสุ่มอาหาร</h2>
    <p class="desc" id="desc">ให้คุณแม่ค้าช่วยเลือกเมนูให้วันนี้</p>
    <div class="price" id="price">ราคา - บาท</div>
    <button class="go" id="btn">สุ่มอาหาร</button>
  </section>

  <section class="shelf">
    <h3>เมนูในร้านทั้งหมด</h3>
    <div class="grid" id="grid"></div>
    <p class="hist" id="hist"></p>
  </section>
</main>

<script>
  // รายการอาหาร: ชื่อ, คำอธิบาย, ราคา, ภาค, ไอคอน
  const foods = [
    {name:"ผัดกะเพราหมูสับไข่ดาว", desc:"หมูสับผัดใบกะเพรากลิ่นหอม เผ็ดจัดจ้าน ราดบนข้าวสวยร้อนๆ พร้อมไข่ดาวกรอบ", price:"50-80", region:"ทั่วประเทศ", icon:"🍳"},
    {name:"ต้มยำกุ้ง", desc:"ซุปรสเปรี้ยวเผ็ดหอมสมุนไพร ทั้งตะไคร้ ข่า ใบมะกรูด ใส่กุ้งตัวโต", price:"150-350", region:"ภาคกลาง", icon:"🍲"},
    {name:"ส้มตำไทยไก่ย่าง", desc:"ส้มตำรสเปรี้ยวหวานเผ็ด กินคู่ไก่ย่างหนังกรอบและข้าวเหนียวร้อนๆ", price:"80-120", region:"ภาคอีสาน", icon:"🥗"},
    {name:"ข้าวมันไก่", desc:"ข้าวหุงน้ำมันไก่หอมมัน เสิร์ฟกับไก่ต้มนุ่มๆ น้ำจิ้มเต้าเจี้ยวและซุปใส", price:"45-70", region:"ทั่วประเทศ", icon:"🍗"},
    {name:"ผัดไทยกุ้งสด", desc:"เส้นจันท์ผัดซอสมะขามเปรี้ยวหวาน โรยถั่วลิสงป่น กินกับถั่วงอกและกุ้ยช่าย", price:"60-100", region:"ภาคกลาง", icon:"🍜"},
    {name:"แกงเขียวหวานไก่", desc:"แกงกะทิสีเขียวหอมพริกแกง เนื้อไก่นุ่ม ใส่มะเขือพวงและใบโหระพา", price:"60-100", region:"ภาคกลาง", icon:"🍛"},
    {name:"ข้าวซอยไก่", desc:"ก๋วยเตี๋ยวน้ำแกงกะทิสไตล์เหนือ เส้นไข่นุ่มและกรอบ เสิร์ฟพร้อมผักดอง", price:"60-90", region:"ภาคเหนือ", icon:"🍜"},
    {name:"ก๋วยเตี๋ยวเรือ", desc:"น้ำซุปเข้มข้นเครื่องเทศหอม ชามเล็กกินได้หลายชาม ใส่หมูกรอบและถั่วงอก", price:"15-25 ต่อชาม", region:"ภาคกลาง", icon:"🍲"},
    {name:"ข้าวผัดปู", desc:"ข้าวผัดไข่หอมกระทะ ใส่เนื้อปูแน่นๆ เสิร์ฟพร้อมพริกน้ำปลาและมะนาว", price:"80-150", region:"ภาคกลาง", icon:"🦀"},
    {name:"ข้าวเหนียวมะม่วง", desc:"ข้าวเหนียวมูนกะทิหอมมัน กินคู่มะม่วงสุกหวานฉ่ำ ปิดท้ายความอร่อย", price:"60-100", region:"ของหวาน", icon:"🥭"}
  ];

  const $ = id => document.getElementById(id);
  const bubbles = ["ลองเมนูนี้ดูไหม?","อร่อยแน่นอน!","วันนี้ต้องนี่เลย","เมนูนี้ขายดีมาก"];
  let last = -1, count = 0, history = [];

  $("total").textContent = foods.length;
  $("grid").innerHTML = foods.map((f,i)=>`<div class="item" id="it${i}"><span>${f.icon}</span><b>${f.name}</b></div>`).join("");

  // แสดงเมนูในการ์ด
  function show(i){
    const f = foods[i];
    $("img").textContent = f.icon;
    $("name").textContent = f.name;
    $("desc").textContent = f.desc;
    $("price").textContent = "ราคา " + f.price + " บาท";
    $("region").textContent = f.region;
    document.querySelectorAll(".item").forEach((e,k)=>e.classList.toggle("on",k===i));
  }

  // สุ่มเมนู ไม่ซ้ำกับครั้งก่อน
  function pick(){
    let i;
    do { i = Math.floor(Math.random()*foods.length); } while (i === last);
    return i;
  }

  $("btn").addEventListener("click", () => {
    const btn = $("btn"), tile = $("img");
    btn.disabled = true; tile.classList.add("spin");
    $("bubble").textContent = "กำลังหาเมนูให้...";
    const result = pick();
    // สลับเมนูเร็วๆ ประมาณ 1 วินาที แล้วหยุดที่ผลลัพธ์
    const timer = setInterval(() => show(Math.floor(Math.random()*foods.length)), 90);
    setTimeout(() => {
      clearInterval(timer);
      show(result); last = result; count++;
      tile.classList.remove("spin"); btn.disabled = false;
      $("count").textContent = "สุ่มแล้ว " + count + " ครั้ง";
      $("bubble").textContent = bubbles[Math.floor(Math.random()*bubbles.length)];
      history.unshift(foods[result].name);
      $("hist").textContent = "ที่สุ่มได้ล่าสุด: " + history.slice(0,5).join(", ");
    }, 1000);
  });
</script>
</body>
</html>
